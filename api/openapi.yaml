  /api/v1/managed-listings/{listingId}/draft:
    put:
      tags: [Fichas gestionadas]
      operationId: saveListingDraft
      summary: Guardar el borrador de una ficha (crear o actualizar)
      description: |
        Si hay borrador, lo actualiza. Si no, crea uno nuevo copiando contenido y fotos de la versión más reciente (publicada o rechazada),
        sin tocar la publicada, que sigue visible (HU-016). Una versión pendiente no se edita: 409 `invalid_state_transition` (HU-010 criterio 2; regla aprobada en D-044).
        Solo fichas de prestador. Los atractivos no tienen borrador en esta entrega.
      x-roles: [provider]
      x-ownership: "dueño del negocio de la ficha"
      x-bot-equivalent: false
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingDraftSave' }
      responses:
        '200':
          description: Borrador guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedListing' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/managed-listings/{listingId}/submission:
    post:
      tags: [Fichas gestionadas]
      operationId: submitListingForReview
      summary: Enviar el borrador a revisión
      description: |
        Borrador a pendiente. Exige exactamente los campos obligatorios de D-003 (nombre, municipio, categoría, descripción,
        horarios, contacto y enlace de Maps) y, en rutas y experiencias, el tipo de experiencia (F018). El tipo de establecimiento
        es opcional (D-040). Además exige que no haya duplicado, la declaración de autorización de guías y contactos (D-024) y confirmación.
        Si falta un campo responde 422 con `errors[]` por campo. Sin borrador responde 409.
      x-roles: [provider]
      x-ownership: "dueño del negocio de la ficha"
      x-bot-equivalent: false
      parameters:
        - $ref: '#/components/parameters/ListingId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingSubmission' }
      responses:
        '200':
          description: Ficha pendiente de revisión
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedListing' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

