  /api/v1/reviews/{versionId}/approval:
    post:
      tags: [Revisión]
      operationId: approveListingVersion
      summary: Aprobar una versión pendiente
      description: |
        Pendiente a publicada; la publicada anterior pasa a reemplazada en la misma transacción (HU-014, HU-016; invariante 3).
        Se avisa al prestador por el bot (Inferido) y se registra fecha y responsable.
      x-roles: [admin]
      x-bot-equivalent: true
      parameters:
