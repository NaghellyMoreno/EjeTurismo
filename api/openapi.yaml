  /api/v1/managed-listings/{listingId}/versions/{versionId}/photo-uploads:
    post:
      tags: [Fotografías]
      operationId: createPhotoUpload
      summary: Pedir una URL firmada para subir una fotografía
      description: |
        Verifica permiso y que la versión sea editable: borrador propio del prestador, o versión publicada de un atractivo
        en el caso del administrador (ADR 0009). Con otra versión responde 409 `invalid_state_transition`.
        Comprueba: menos de 10 fotos en la versión (D-031), tipo permitido, tamaño por foto de hasta 5 000 000 bytes (D-042),
        total de la versión hasta 2 GB (D-031) y cuota global del almacén (900 000 000 bytes en producción, D-042; configurable por entorno).
        Errores 409 con `code` `photo_limit_exceeded`, `photo_total_size_exceeded` o `storage_quota_exceeded`; 422 por tipo o tamaño.
        Límite de intentos por cuenta (429; ADR 0006).
      x-roles: [provider, admin]
      x-ownership: "prestador: dueño del negocio; administrador: solo atractivos"
      x-bot-equivalent: false
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoUploadRequest' }
      responses:
        '201':
          description: URL de subida emitida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoUploadTicket' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/managed-listings/{listingId}/versions/{versionId}/photos:
    post:
      tags: [Fotografías]
      operationId: registerPhoto
      summary: Registrar una fotografía ya subida
      description: |
        Verifica en Vercel Blob el tamaño real y la firma de imagen (JPEG o PNG) y vuelve a comprobar los límites con bloqueo.
        Si el tamaño real supera el máximo por foto responde 422 `photo_too_large`; si no es imagen, 422 `validation_failed`.
        Si falla, borra el archivo subido. El visitante solo verá la foto cuando la versión que la contiene esté publicada (HU-017 criterio 1).
      x-roles: [provider, admin]
      x-ownership: "el mismo actor que pidió la subida"
      x-bot-equivalent: false
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/VersionId'
