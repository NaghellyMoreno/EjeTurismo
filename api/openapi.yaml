    post:
      tags: [Revisión]
      operationId: rejectListingVersion
      summary: Rechazar una versión pendiente con motivo
      description: |
        Motivo obligatorio (HU-014 criterio 2). Si la ficha tenía versión publicada, esta se conserva (HU-016 criterio 3).
        El prestador ve el motivo y recibe un mensaje del bot (Inferido).
      x-roles: [admin]
      x-bot-equivalent: true
