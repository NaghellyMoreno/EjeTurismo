openapi: 3.1.0
info:
  title: Eje Turismo API
  version: 0.3.1
  description: |
    Contrato entre la Mini App de Telegram, el bot y el backend de Eje Turismo.
    Fuente de verdad del producto: docs/00-contexto-producto.md. Arquitectura: docs/03-arquitectura.md.
    Versión 0.2.0: revisión de la iteración 1 de preparación (D-034 a D-045).
    Versión 0.3.0: iteración 2 de preparación. Tipo y número de documento del registro de prestador (D-046, cierra D-045),
    tipo de experiencia gastronómica en el directorio (D-048) y versión del aviso "2026-11-v3" (D-050).
    Versión 0.3.1: iteración 3 de preparación, sin cambios de esquemas ni de operaciones. Nombre del tipo de experiencia
    gastronómica, "Sabores de Caldas" (D-052, D-053); duplicado del registro por tipo y número (D-054); normalización del
    número, nombres de las siglas y máximo técnico confirmados (D-055).

    Reglas generales:
    - Autenticación: la Mini App envía `Authorization: tma <initData>` con la cadena cruda de `Telegram.WebApp.initData`.
      El backend valida la firma HMAC y la vigencia de `auth_date` en cada petición (ADR 0003). No hay cookies ni sesiones.
      Una firma inválida responde 401 sin consultar la base y sin registrar la IP (D-008).
    - El bot no usa esta API por HTTP: llama a los mismos servicios dentro del proceso (ADR 0001). Cada operación indica en
      `x-bot-equivalent` si el bot la usa.
    - Roles por operación en la extensión `x-roles`:
      `public` (sin identidad; solo el aviso de privacidad), `telegram_user` (identidad válida, haya aceptado o no el aviso),
      `account_holder` (tiene cuenta: aceptó alguna versión del aviso, vigente o anterior),
      `consented_user` (aceptó la versión vigente del aviso), `provider` (permiso de prestador activo),
      `admin` (permiso de administrador activo o administrador principal).
      `x-ownership` describe la verificación de negocio o recurso.
    - El aviso se acepta antes de cualquier uso, incluida la exploración de fichas y catálogos (D-039). Sin la versión vigente
      aceptada solo se permite leer el aviso, consultar `getMe`, aceptar y, con cuenta, revocar; el resto responde 403
      con `code: consent_required` (D-008, D-025, D-039).
    - Los límites de intentos (429) solo cuentan cuentas con aviso aceptado; nunca se guarda el ID ni la IP de quien no aceptó (ADR 0006).
    - Las operaciones importantes exigen `confirmed: true` en el cuerpo (invariante 8). Sin él responden 422.
    - Recursos de otro negocio responden 403 `forbidden` sin revelar si existen (invariante 2).
    - Errores: `application/problem+json` con el esquema `Problem`. Nunca contienen número de identidad ni datos de solicitudes.
    - Fechas y horas en ISO 8601 UTC; la interfaz las muestra en America/Bogota. Fechas sin hora (`format: date`) se interpretan en America/Bogota.
    - Límites de caracteres de fichas fijados por D-042 (nombre 100, descripción 1500, horarios 300, contacto 200).
      Los campos con `x-pending: D-013` no tienen límite de producto todavía; llevan un máximo técnico de 4096 caracteres (un mensaje de Telegram).
      El número de documento del registro de prestador también tiene un máximo técnico de 4096 caracteres, aprobado en D-055.
    - Ejemplos con datos ficticios.
servers:
  - url: /
    description: Mismo origen que la Mini App (Vercel)
security:
  - telegramInitData: []
tags:
  - name: Privacidad
  - name: Sesión
  - name: Registro de prestadores
  - name: Roles
  - name: Catálogos
  - name: Fichas gestionadas
  - name: Fotografías
  - name: Revisión
  - name: Consulta pública
  - name: Solicitudes
  - name: Integraciones internas

paths:
  /api/v1/privacy-notices/current:
    get:
      tags: [Privacidad]
      operationId: getCurrentPrivacyNotice
      summary: Obtener el aviso de privacidad vigente y su declaración
      description: No guarda ningún dato (D-008). Fuente HU-001, D-025.
      security: []
      x-roles: [public]
      x-bot-equivalent: true
      responses:
        '200':
          description: Aviso vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyNotice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/me:
    get:
      tags: [Sesión]
      operationId: getMe
      summary: Consultar mi estado (aviso, roles y registro) según el backend
      description: |
        Devuelve lo que el backend sabe de la persona identificada por `initData`. Solo lee: si no ha aceptado el aviso,
        `consent.required` es verdadero y no se guarda nada (D-008). La Mini App muestra solo las opciones del rol que informa
        esta respuesta (HU-006 criterio 4) y, si `consent.required`, solo el aviso (D-039).
      x-roles: [telegram_user]
      x-bot-equivalent: true
      responses:
        '200':
          description: Estado de la persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/consents:
    post:
      tags: [Privacidad]
      operationId: acceptPrivacyNotice
      summary: Aceptar el aviso de privacidad vigente
      description: |
        Crea o actualiza la cuenta y registra la aceptación con fecha, canal y versión (HU-001; D-025).
        La prueba en `consent_events` guarda solo evento, fecha, canal y versión, sin identificador de la persona (D-036).
        Es idempotente: si la cuenta ya aceptó esa versión, responde 201 con el mismo estado sin duplicar la prueba.
        Si `noticeVersion` no es la vigente responde 409 `notice_version_outdated`.
      x-roles: [telegram_user]
      x-bot-equivalent: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentAcceptance' }
      responses:
        '201':
          description: Aceptación registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/consents/revocations:
    post:
      tags: [Privacidad]
      operationId: revokeMyAuthorization
      summary: Revocar mi autorización de tratamiento de datos
      description: |
        "Revocar mi autorización" (D-018). En una transacción: borra las solicitudes enviadas por la persona y avisa al prestador;
        si es prestador, borra su número de identidad, su registro y su rol, borra las solicitudes recibidas por sus negocios y avisa a cada visitante,
        y deja sus fichas como están (D-019, D-029); si es administrador, pierde el rol (D-020).
        Conserva solo la prueba de autorización y revocación: evento, fecha, canal y versión del aviso, sin número de identidad
        ni ningún pseudónimo del ID de Telegram (D-021, D-036). Borra todas las filas de permisos con su ID de Telegram.
        Disponible para cualquier persona con cuenta, aunque haya aceptado una versión anterior del aviso (HU-030 criterio 1; ADR 0005).
        Responde 409 `principal_admin_protected` si es el administrador principal y 409 `last_admin_protected` si es el único administrador (D-020, D-032).
      x-roles: [account_holder]
      x-bot-equivalent: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Confirmation' }
      responses:
        '200':
          description: Autorización revocada y datos eliminados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevocationResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/provider-registrations:
    post:
      tags: [Registro de prestadores]
      operationId: createProviderRegistration
      summary: Registrarme como prestador con mi tipo y número de documento de identidad
      description: |
        Crea un registro pendiente que vincula el tipo y el número de documento de identidad con el ID de Telegram (HU-002).
        Formato (D-046): `identityDocumentType` es uno de CC, CE, PPT o PA, e `identityNumber` es texto no vacío, sin caracteres
        de control y sin reglas de caracteres ni de longitud por tipo. Un tipo fuera de la lista o un número vacío responde 422
        `validation_failed`, con `errors[].code` igual a `not_in_list` o `required`, sin crear registro (F002, paso 2).
        Rechaza duplicados por documento o por cuenta con 409 `duplicate` (sección 3.12). El duplicado por documento compara tipo
        y número (D-054): "CC 123" y "CE 123" son documentos distintos. El número se compara normalizado, sin espacios al inicio
        ni al final y con las letras en mayúsculas, sin quitar puntos ni espacios internos (D-055).
        Una cuenta con rol de administrador (incluido el administrador principal) recibe 403 `admin_cannot_register_as_provider` (D-038).
        Ni el tipo ni el número se devuelven en la respuesta, y ninguno de los dos se registra en logs.
        Límite de intentos por cuenta (429; ADR 0006).
      x-roles: [consented_user]
      x-bot-equivalent: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderRegistrationCreate' }
      responses:
        '201':
          description: Registro pendiente de autorización
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProviderRegistration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Registro de prestadores]
      operationId: listProviderRegistrations
      summary: Listar registros de prestadores (administrador)
      description: Incluye el tipo y el número de documento de identidad, visibles solo para administradores (D-011, D-046). Fuente HU-003.
      x-roles: [admin]
      x-bot-equivalent: true
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ProviderRegistrationStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Registros
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProviderRegistrationPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/provider-registrations/me:
    get:
      tags: [Registro de prestadores]
      operationId: getMyProviderRegistration
      summary: Consultar el estado de mi registro de prestador
      description: No devuelve el tipo ni el número de documento de identidad.
      x-roles: [consented_user]
      x-bot-equivalent: true
      responses:
        '200':
          description: Mi registro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnProviderRegistration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/provider-registrations/{registrationId}/approval:
    post:
      tags: [Registro de prestadores]
      operationId: approveProviderRegistration
      summary: Autorizar el registro de un prestador
      description: |
        El registro pasa a aprobado y se crea el permiso de prestador (invariante 4). Se avisa al usuario por el bot y se registra fecha,
        responsable y resultado (HU-003). Responde 409 `invalid_state_transition` si el registro no está pendiente y
        409 `role_conflict` si la cuenta obtuvo entretanto el rol de administrador (D-038).
      x-roles: [admin]
      x-bot-equivalent: true
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Confirmation' }
      responses:
        '200':
          description: Registro aprobado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProviderRegistration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/provider-registrations/{registrationId}/rejection:
    post:
      tags: [Registro de prestadores]
      operationId: rejectProviderRegistration
      summary: Rechazar el registro de un prestador
      description: El usuario no obtiene el rol y recibe un mensaje del bot (HU-003 criterio 3, Inferido). Queda registrado.
      x-roles: [admin]
      x-bot-equivalent: true
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationRejection' }
      responses:
        '200':
          description: Registro rechazado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProviderRegistration' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/role-grants:
    get:
      tags: [Roles]
      operationId: listRoleGrants
      summary: Listar usuarios autorizados (administradores y prestadores)
      description: Base de la opción "Revocar rol" (D-020). No incluye número de identidad.
      x-roles: [admin]
      x-bot-equivalent: true
      parameters:
        - name: role
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Role' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Permisos activos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleGrantPage' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Roles]
      operationId: authorizeAdministrator
      summary: Autorizar el ID de Telegram de otra persona como administrador
      description: |
        Solo crea permisos de administrador; el de prestador nace únicamente al aprobar un registro (invariante 4).
        No pide número de identidad (D-007). Si el ID ya es administrador responde 409 `duplicate` (HU-004).
        Guarda el ID de Telegram aunque esa persona aún no haya aceptado el aviso; el aviso lo menciona (D-037).
        El permiso solo se usa cuando la persona acepta el aviso vigente (D-039).
        Si el ID tiene un permiso de prestador activo o un registro pendiente responde 409 `role_conflict`
        (Inferido a partir de D-038; Pendiente de aprobación en docs/03-arquitectura.md).
      x-roles: [admin]
      x-bot-equivalent: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdministratorAuthorization' }
      responses:
        '201':
          description: Administrador autorizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleGrant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/role-grants/{grantId}/revocation:
    post:
      tags: [Roles]
      operationId: revokeRole
      summary: Revocar el rol de un administrador o prestador ("Revocar rol")
      description: |
        La siguiente operación del usuario afectado con ese rol es rechazada (D-015). Queda registrada con fecha, responsable y usuario afectado.
        409 `principal_admin_protected` sobre el administrador principal (regla aprobada en D-044) y 409 `last_admin_protected` si deja sin administradores (D-020).
        Sobre un prestador solo quita el rol: sus fichas no cambian de estado y sus fichas publicadas dejan de aceptar solicitudes nuevas
        (`acceptsRequests` falso); las solicitudes existentes se conservan sin acceso (D-043). No borra datos personales.
      x-roles: [admin]
      x-bot-equivalent: true
      parameters:
        - name: grantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Confirmation' }
      responses:
        '200':
          description: Rol revocado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleGrant' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/municipalities:
    get:
      tags: [Catálogos]
      operationId: listMunicipalities
      summary: Listar municipios
      description: Exige el aviso vigente aceptado (D-039).
      x-roles: [consented_user]
      x-bot-equivalent: true
      responses:
        '200':
          description: Municipios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Municipality' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Catálogos]
      operationId: createMunicipality
      summary: Crear un municipio
      description: Rechaza nombres duplicados (409 `duplicate`). Zona es dato opcional (D-013). Fuente HU-007. Canal Mini App, pantalla M10 (D-041).
      x-roles: [admin]
      x-bot-equivalent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MunicipalityCreate' }
      responses:
        '201':
          description: Municipio creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Municipality' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/municipalities/{municipalityId}:
    patch:
      tags: [Catálogos]
      operationId: updateMunicipality
      summary: Editar un municipio
      description: Registra fecha y responsable (HU-007 criterio 3). Canal Mini App, pantalla M10 (D-041).
      x-roles: [admin]
      x-bot-equivalent: false
      parameters:
        - name: municipalityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MunicipalityUpdate' }
      responses:
        '200':
          description: Municipio actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Municipality' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/categories:
    get:
      tags: [Catálogos]
      operationId: listCategories
      summary: Listar categorías (lista cerrada)
      description: Exige el aviso vigente aceptado (D-039).
      x-roles: [consented_user]
      x-bot-equivalent: true
      responses:
        '200':
          description: Categorías
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Catálogos]
      operationId: createCategory
      summary: Crear una categoría
      description: Lista cerrada administrada por el administrador (D-004). Rechaza duplicados. Canal Mini App, pantalla M11 (D-041).
      x-roles: [admin]
      x-bot-equivalent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogItemCreate' }
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/categories/{categoryId}:
    patch:
      tags: [Catálogos]
      operationId: updateCategory
      summary: Editar una categoría
      description: El cambio se refleja en las fichas que la usan (HU-008 criterio 4, Inferido). Canal Mini App, pantalla M11 (D-041).
      x-roles: [admin]
      x-bot-equivalent: false
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogItemUpdate' }
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/experience-types:
    get:
      tags: [Catálogos]
      operationId: listExperienceTypes
      summary: Listar tipos de experiencia (lista cerrada)
      description: |
        Exige el aviso vigente aceptado (D-039). La semilla de referencia carga en todos los entornos el tipo de experiencia
        gastronómica "Sabores de Caldas" con `isGastronomic` verdadero, que incluye sus fichas en el directorio gastronómico
