        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Fichas gestionadas]
      operationId: createListing
      summary: Crear una ficha
      description: |
        Prestador: `kind` `establishment` o `route_experience`; crea negocio, ficha y versión en borrador no visible al visitante (HU-010 a HU-012; D-006).
        Administrador: `kind` `attraction`; exige los campos obligatorios de D-003 y queda publicada sin validación (HU-009; D-005).
        Cualquier otra combinación responde 403. Duplicado (mismo nombre en el mismo municipio, D-003) responde 409 `duplicate`.
      x-roles: [provider, admin]
      x-bot-equivalent: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreate' }
      responses:
        '201':
          description: Ficha creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedListing' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
