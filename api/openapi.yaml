        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/public/listings:
    get:
      tags: [Consulta pública]
      operationId: listPublishedListings
      summary: Explorar fichas publicadas
      description: |
        Solo versiones publicadas (invariante 3). Exige el aviso vigente aceptado, también para explorar (D-039).
        Filtros por municipio y categoría (HU-019), tipo de experiencia (HU-021) y directorio gastronómico (HU-011, `gastronomic=true`):
        fichas `establishment` cuyo tipo de establecimiento tiene `isGastronomic` (restaurante o café, D-040) y fichas `route_experience`
        cuyo tipo de experiencia tiene `isGastronomic` (el tipo de experiencia gastronómica de la semilla, D-048). Con `gastronomic=true`
        y `kind`, el filtro se restringe a ese tipo de ficha. Nunca incluye datos personales del prestador.
