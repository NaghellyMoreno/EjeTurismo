          required: false
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ListingKind' }
        - name: experienceTypeId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: gastronomic
          in: query
          required: false
          schema: { type: boolean }
