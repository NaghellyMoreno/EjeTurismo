      operationId: listManagedListings
      summary: Listar las fichas que puedo gestionar
      description: |
        Prestador: solo las fichas de sus negocios (invariante 2; F016). Administrador: los atractivos y las fichas de prestadores
        desde que se envían a revisión: pendientes, publicadas o rechazadas (sin acceso a borradores ajenos; valor por defecto pendiente de aprobación).
      x-roles: [provider, admin]
