        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoRegistration' }
      responses:
        '201':
          description: Foto registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Photo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/managed-listings/{listingId}/versions/{versionId}/photos/{photoId}:
    delete:
      tags: [Fotografías]
      operationId: removePhoto
      summary: Quitar una fotografía de una versión editable
      description: |
        Solo en versiones editables: borrador del prestador, o versión publicada de un atractivo en el caso del administrador (ADR 0009).
        Exige `confirmed=true` en la consulta (invariante 8). En fichas de prestador no afecta la versión publicada.
      x-roles: [provider, admin]
      x-ownership: "prestador: dueño del negocio; administrador: solo atractivos"
      x-bot-equivalent: false
      parameters:
        - $ref: '#/components/parameters/ListingId'
        - $ref: '#/components/parameters/VersionId'
        - name: photoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: confirmed
          in: query
          required: true
          schema: { type: boolean, const: true }
      responses:
        '204':
          description: Foto quitada
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }

